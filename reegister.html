<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everest - Register</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <script>tailwind.config={theme:{extend:{colors:{primary:'#00A36C',secondary:'#4ECDC4'},borderRadius:{'none':'0px','sm':'4px',DEFAULT:'8px','md':'12px','lg':'16px','xl':'20px','2xl':'24px','3xl':'32px','full':'9999px','button':'8px'}}}}</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <style>
        :where([class^="ri-"])::before { content: "\f3c2"; }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        input:focus {
            outline: none;
            border-color: #00A36C;
        }
    </style>
</head>
<body class="bg-gray-50">
    <header class="w-full border-b border-gray-100 bg-white">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center">
            <div class="flex items-center text-primary">
                <svg class="w-8 h-8 mr-2" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12,2L2,12h3v8h14v-8h3L12,2z M12,15c-1.1,0-2-0.9-2-2s0.9-2,2-2s2,0.9,2,2S13.1,15,12,15z"/>
                </svg>
                <span class="text-xl font-['Pacifico'] tracking-wide">Everest</span>
            </div>
        </div>
    </header>
    <main class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded shadow-sm border border-gray-100 overflow-hidden relative">
            <!-- Watermark Logo -->
            <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="text-primary opacity-5 transform scale-150">
                    <svg class="w-48 h-48" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12,2L2,12h3v8h14v-8h3L12,2z M12,15c-1.1,0-2-0.9-2-2s0.9-2,2-2s2,0.9,2,2S13.1,15,12,15z"/>
                    </svg>
                    <div class="text-center text-4xl font-['Pacifico'] -mt-6">Everest</div>
                </div>
            </div>
            <!-- Form Content -->
            <div class="p-8 relative z-10">
                <a href="homehat.html" class="text-2xl font-bold text-primary mb-6">REGISTER</h1>
                <form class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                        <div class="grid grid-cols-2 gap-4">
                            <input type="text" placeholder="First Name" class="w-full px-3 py-2 border border-gray-300 rounded text-sm">
                            <input type="text" placeholder="Last Name" class="w-full px-3 py-2 border border-gray-300 rounded text-sm">
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input type="email" placeholder="Email..." class="w-full px-3 py-2 border border-gray-300 rounded text-sm">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                        <input type="password" placeholder="Password" class="w-full px-3 py-2 border border-gray-300 rounded text-sm">
                    </div>
                    
                    <button type="submit" class="w-32 bg-primary text-white py-2 px-4 rounded-button whitespace-nowrap hover:bg-opacity-90 transition-all">Register</button>
                </form>
                
                <div class="mt-6 text-sm text-gray-600">
                    Already Have Account? <a href="login.html" class="text-primary hover:underline">Login</a>
                </div>
            </div>
        </div>
    </main>

    <script id="form-validation">
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('form');
            form.addEventListener('submit', function(e) {
                e.preventDefault();
                const inputs = form.querySelectorAll('input');
                let isValid = true;
                
                inputs.forEach(input => {
                    if (!input.value.trim()) {
                        input.classList.add('border-red-500');
                        isValid = false;
                    } else {
                        input.classList.remove('border-red-500');
                    }
                });
                
                if (isValid) {
                    alert('Registration successful!');
                    form.reset();
                }
            });
            
            const inputs = form.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('input', function() {
                    if (input.value.trim()) {
                        input.classList.remove('border-red-500');
                    }
                });
            });
        });
    </script>
</body>
</html>
