<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ringkasan Pesanan</title>
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<script>tailwind.config={theme:{extend:{colors:{primary:'#4F46E5',secondary:'#6366F1'},borderRadius:{'none':'0px','sm':'4px',DEFAULT:'8px','md':'12px','lg':'16px','xl':'20px','2xl':'24px','3xl':'32px','full':'9999px','button':'8px'}}}}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
<style>
:where([class^="ri-"])::before { content: "\f3c2"; }
body {
font-family: 'Inter', sans-serif;
background-color: #f9fafb;
}
.rupiah::before {
content: "Rp ";
}
.skeleton {
animation: pulse 1.5s infinite;
}
@keyframes pulse {
0%, 100% {
opacity: 0.5;
}
50% {
opacity: 0.8;
}
}
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
-webkit-appearance: none;
margin: 0;
}
</style>
</head>
<body class="min-h-screen flex flex-col">
<header class="sticky top-0 bg-white shadow-sm z-10">
<div class="container mx-auto px-4 py-4 flex items-center">
<button class="w-10 h-10 flex items-center justify-center text-gray-700 mr-4">
<i class="ri-arrow-left-line ri-lg"></i>
</button>
<h1 class="text-xl font-semibold text-gray-800">Ringkasan Pesanan</h1>
</div>
</header>
<main class="flex-grow container mx-auto px-4 py-6 mb-24">
<!-- Loading State -->
<div id="loading-state" class="space-y-4">
<div class="skeleton bg-gray-200 h-24 rounded mb-4"></div>
<div class="skeleton bg-gray-200 h-24 rounded mb-4"></div>
<div class="skeleton bg-gray-200 h-24 rounded mb-4"></div>
<div class="skeleton bg-gray-200 h-48 rounded"></div>
</div>
<!-- Error State -->
<div id="error-state" class="hidden flex flex-col items-center justify-center py-12">
<div class="w-16 h-16 flex items-center justify-center text-red-500 mb-4">
<i class="ri-error-warning-line ri-3x"></i>
</div>
<h2 class="text-lg font-medium text-gray-900 mb-2">Gagal Memuat Data</h2>
<p class="text-gray-500 text-center mb-6">Terjadi kesalahan saat memuat data pesanan Anda.</p>
<button class="bg-primary text-white py-2 px-6 rounded-button font-medium whitespace-nowrap">
Coba Lagi
</button>
</div>
<!-- Empty State -->
<div id="empty-state" class="hidden flex flex-col items-center justify-center py-12">
<div class="w-16 h-16 flex items-center justify-center text-gray-400 mb-4">
<i class="ri-shopping-cart-line ri-3x"></i>
</div>
<h2 class="text-lg font-medium text-gray-900 mb-2">Keranjang Kosong</h2>
<p class="text-gray-500 text-center mb-6">Anda belum menambahkan produk ke keranjang.</p>
<button class="bg-primary text-white py-2 px-6 rounded-button font-medium whitespace-nowrap">
Belanja Sekarang
</button>
</div>
<!-- Content State -->
<div id="content-state" class="hidden">
<section class="mb-8">
<h2 class="text-lg font-medium text-gray-900 mb-4">Produk yang Dibeli</h2>
<div id="product-list" class="space-y-4">
<!-- Products will be inserted here by JavaScript -->
</div>
</section>
<section class="bg-white rounded-lg shadow-sm p-6">
<h2 class="text-lg font-medium text-gray-900 mb-4">Detail Pembayaran</h2>
<div class="space-y-3">
<div class="flex justify-between">
<span class="text-gray-600">Subtotal</span>
<span id="subtotal" class="font-medium rupiah">0</span>
</div>
<div class="flex justify-between">
<span class="text-gray-600">Biaya Pengiriman</span>
<span id="shipping" class="font-medium rupiah">15.000</span>
</div>
<div class="flex justify-between">
<span class="text-gray-600">Biaya Layanan</span>
<span id="service-fee" class="font-medium rupiah">2.500</span>
</div>
<div class="border-t border-gray-200 my-3 pt-3">
<div class="flex justify-between">
<span class="text-gray-800 font-medium">Total</span>
<span id="total" class="text-gray-900 font-bold rupiah">0</span>
</div>
</div>
</div>
</section>
</div>
</main>
<footer class="fixed bottom-0 left-0 right-0 bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
<div class="container mx-auto p-4">
<button id="checkout-button" class="w-full bg-primary hover:bg-primary/90 text-white py-3 px-6 rounded-button font-medium text-center whitespace-nowrap transition-colors">
Lanjutkan Pembayaran
</button>
</div>
</footer>
<script id="cart-data-handler">
document.addEventListener('DOMContentLoaded', function() {
const loadingState = document.getElementById('loading-state');
const errorState = document.getElementById('error-state');
const emptyState = document.getElementById('empty-state');
const contentState = document.getElementById('content-state');
const productList = document.getElementById('product-list');
const subtotalElement = document.getElementById('subtotal');
const totalElement = document.getElementById('total');

if (!localStorage.getItem('cartItems')) {
  localStorage.setItem('cartItems', JSON.stringify([
    { id: 1, quantity: 2 },
    { id: 2, quantity: 1 },
    { id: 3, quantity: 3 }
  ]));
}

const cartItems = JSON.parse(localStorage.getItem('cartItems'));
// Format angka ke format Rupiah
function formatRupiah(number) {
return new Intl.NumberFormat('id-ID').format(number);
}
// Fungsi untuk mengambil data produk dari API
async function fetchProducts() {
try {
const response = await fetch('https://fakestoreapi.com/products');
if (!response.ok) {
throw new Error('Network response was not ok');
}
return await response.json();
} catch (error) {
console.error('Error fetching products:', error);
throw error;
}
}
// Fungsi untuk menampilkan produk di keranjang
async function displayCart() {
try {
loadingState.classList.remove('hidden');
errorState.classList.add('hidden');
emptyState.classList.add('hidden');
contentState.classList.add('hidden');
if (cartItems.length === 0) {
loadingState.classList.add('hidden');
emptyState.classList.remove('hidden');
return;
}
const products = await fetchProducts();
// Filter produk yang ada di keranjang
const cartProducts = cartItems.map(cartItem => {
const product = products.find(p => p.id === cartItem.id);
return {
...product,
quantity: cartItem.quantity,
subtotal: product.price * cartItem.quantity
};
});
// Hitung total
const subtotal = cartProducts.reduce((sum, product) => sum + product.subtotal, 0);
const shipping = 15000; // Rp 15.000
const serviceFee = 2500; // Rp 2.500
const total = subtotal + shipping + serviceFee;
// Update UI
productList.innerHTML = '';
cartProducts.forEach(product => {
const productElement = document.createElement('div');
productElement.className = 'bg-white rounded-lg shadow-sm p-4 flex';
productElement.innerHTML = `
<div class="w-20 h-20 flex-shrink-0 bg-gray-100 rounded overflow-hidden mr-4">
<img src="${product.image}" alt="${product.title}" class="w-full h-full object-contain">
</div>
<div class="flex-grow">
<h3 class="text-sm font-medium text-gray-900 line-clamp-2 mb-1">${product.title}</h3>
<div class="flex justify-between items-center mt-2">
<span class="text-sm text-gray-500">${formatRupiah(product.price * 15000)} × ${product.quantity}</span>
<span class="font-medium rupiah">${formatRupiah(product.subtotal * 15000)}</span>
</div>
</div>
`;
productList.appendChild(productElement);
});
// Update total
subtotalElement.textContent = formatRupiah(subtotal * 15000);
totalElement.textContent = formatRupiah(total * 15000);
// Show content
loadingState.classList.add('hidden');
contentState.classList.remove('hidden');
} catch (error) {
loadingState.classList.add('hidden');
errorState.classList.remove('hidden');
console.error('Error displaying cart:', error);
}
}
// Initialize
displayCart();
// Event listener for checkout button
document.getElementById('checkout-button').addEventListener('click', function() {
  const modal = document.createElement('div');
  modal.className = 'fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50';
  modal.innerHTML = `
    <div class="bg-white rounded-lg p-6 max-w-sm w-full mx-4">
      <h3 class="text-lg font-medium text-gray-900 mb-4">Konfirmasi Pembayaran</h3>
      <p class="text-gray-600 mb-6">Pesanan Anda akan diproses. Lanjutkan ke pembayaran?</p>
      <div class="flex justify-end space-x-3">
        <button class="px-4 py-2 text-gray-600 hover:text-gray-800" onclick="this.closest('.fixed').remove()">Batal</button>
        <button class="px-4 py-2 bg-primary text-white rounded-button" onclick="processCheckout()">Lanjutkan</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
});

function processCheckout() {
  localStorage.removeItem('cartItems');
  window.location.href = '/payment';
}
});
</script>
</body>
</html>
